name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quantskills/registry
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node scripts/build.mjs --snapshot registry/catalog.snapshot.json --evaluations-root registry/evaluations --output-dir .
      - run: node --input-type=module -e "import { readFileSync } from 'node:fs'; import { verifyBuild } from './scripts/verify-build.mjs'; verifyBuild('.', JSON.parse(readFileSync('registry/catalog.snapshot.json', 'utf8')))"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
