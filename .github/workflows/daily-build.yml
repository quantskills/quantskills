name: validated-snapshot-build

on:
  workflow_dispatch:
    inputs:
      snapshot_url:
        description: Exact Registry catalog snapshot URL
        required: true
        type: string
      expected_snapshot_id:
        description: Expected sha256 snapshot ID
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: quantskills/registry
          path: registry
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download exact snapshot
        run: curl --fail --location --output "$RUNNER_TEMP/catalog.snapshot.json" "${{ inputs.snapshot_url }}"
      - name: Validate snapshot identity
        run: node -e "const x=require(process.env.RUNNER_TEMP + '/catalog.snapshot.json'); if(x.snapshot_id !== process.env.EXPECTED) process.exit(1)"
        env:
          EXPECTED: ${{ inputs.expected_snapshot_id }}
      - name: Test and build
        run: |
          npm test
          node scripts/build.mjs --snapshot "$RUNNER_TEMP/catalog.snapshot.json" --evaluations-root registry/evaluations --output-dir .
          node -e "import('./scripts/verify-build.mjs').then(({verifyBuild})=>{const x=require(process.env.RUNNER_TEMP + '/catalog.snapshot.json'); verifyBuild('.',x)})"
      - name: Commit validated generated outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "abgyjaguo"
          git config user.email "213890245+abgyjaguo@users.noreply.github.com"
          git add README.md README.en.md site/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: render validated catalog snapshot"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          fi
